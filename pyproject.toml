[project]
name = "controlfinder"
version = "0.1.0"
description = "Evaluated RAG + LangGraph agent over NIST SP 800-53 Rev 5"
requires-python = ">=3.11"
dependencies = [
    "cursor-sdk==1.0.37",
    "fastapi==0.143.0",
    "langgraph==1.2.14",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.1.0",
    "tokenizers==0.23.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Resolve every package, including transitive ones, as of this date, so nothing in the
# lockfile is newer than two weeks before the project started (2026-10-23).
exclude-newer = "2026-10-09T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
